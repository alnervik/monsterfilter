name: Update creature data

on:
  schedule:
    # Varje måndag kl 03:00 UTC — creature-data ändras sällan
    - cron: "0 3 * * 1"
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - "fetch_creatures.py"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch creature data
        run: python fetch_creatures.py

      - name: Commit changes if any
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet -- docs/data/creatures.json; then
            git add docs/data/creatures.json
            git commit -m "chore: update creature data"
            git push
          else
            echo "Ingen förändring i creature-datan."
          fi
